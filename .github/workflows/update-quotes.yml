name: Kurse aktualisieren

on:
  schedule:
    # Mo–Fr: zur Eröffnung in Zürich, mehrmals während der US-Börsenzeit und nach US-Börsenschluss (UTC)
    - cron: "15 8 * * 1-5"
    - cron: "0 15,17,19 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_quotes.py
      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.js
          git diff --cached --quiet || (git commit -m "Kurse aktualisieren" && git push)
