name: Kurse aktualisieren

on:
  schedule:
    # Mo–Fr: zur Eröffnung in Zürich (09:15 MEZ / 10:15 MESZ)
    - cron: '17 8 * * 1-5'
    # Mo–Fr: während der US-Börsenzeit (16:13, 18:13, 20:13 MEZ)
    - cron: '13 15,17,19 * * 1-5'
    # Mo–Fr: nach US-Börsenschluss (22:33 MEZ)
    - cron: '33 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_quotes.py
      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.js
          git diff --cached --quiet || (git commit -m "Kurse aktualisieren" && git push)
